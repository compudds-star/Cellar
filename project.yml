# XcodeGen spec — run `xcodegen generate` inside this Cellar/ dir to produce
# Cellar.xcodeproj.  (brew install xcodegen)
#
# This is a STANDALONE project, independent of DOONY. It lives in a subdir only
# for convenience; to split it into its own repo, copy the Cellar/ directory out
# and `git init` there — nothing here references anything outside Cellar/.
name: Cellar
options:
  bundleIdPrefix: com.doony
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "4"   # bump before every upload — App Store Connect rejects a reused build number
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "24Q366W5BQ"            # your Apple Team ID (same as DOONY)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_BITCODE: NO

targets:
  Cellar:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Cellar
        # Info.plist and entitlements are referenced by build SETTINGS below
        # (INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS), so they must NOT also be
        # swept into the file/resources phases — otherwise Xcode runs two build
        # commands that both write Cellar.app/Info.plist ("Multiple commands
        # produce …"). Excluding them here leaves the settings as the only
        # reference.
        excludes:
          - "Info.plist"
          - "Cellar.entitlements"
    dependencies:
      - target: CellarShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.cellar
        # Hand-maintained entitlements/Info.plist, referenced not generated —
        # see the DOONY project.yml notes for why the `entitlements:`/`info:`
        # keys are avoided.
        CODE_SIGN_ENTITLEMENTS: Cellar/Cellar.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Cellar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only. Must live at target level (see DOONY notes on err 90474).
        TARGETED_DEVICE_FAMILY: "1"

  CellarTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CellarTests
    dependencies:
      - target: Cellar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.cellar.tests
        GENERATE_INFOPLIST_FILE: YES

  CellarUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CellarUITests
    dependencies:
      - target: Cellar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.cellar.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Cellar

  # Share extension: "Cellar" in the share sheet (Vivino, Safari, Photos). It writes a
  # pending import to the App Group folder; the app imports it when it comes to the
  # front. Info.plist/entitlements are hand-maintained, like the app's.
  CellarShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: CellarShare
        excludes:
          - "Info.plist"
          - "CellarShare.entitlements"
      - path: Cellar/Shared
      - path: Cellar/Scan/LabelParser.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.cellar.share
        CODE_SIGN_ENTITLEMENTS: CellarShare/CellarShare.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: CellarShare/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
