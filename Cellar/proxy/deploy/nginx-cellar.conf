# nginx reverse proxy + TLS for the Cellar pricing proxy.
# Put at /etc/nginx/sites-available/cellar and symlink into sites-enabled,
# then run certbot (below) to fill in the TLS certificate lines.

server {
    listen 80;
    server_name wine.example.com;          # <-- your domain
    # certbot will add the ACME challenge + 301-to-HTTPS redirect here.
}

server {
    listen 443 ssl http2;
    server_name wine.example.com;          # <-- your domain

    # Filled in by: sudo certbot --nginx -d wine.example.com
    # ssl_certificate     /etc/letsencrypt/live/wine.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wine.example.com/privkey.pem;

    # Only the /valuation and /health endpoints are needed.
    location / {
        proxy_pass         http://127.0.0.1:8787;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
