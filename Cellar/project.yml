# XcodeGen spec — run `xcodegen generate` inside this Cellar/ dir to produce
# Cellar.xcodeproj.  (brew install xcodegen)
#
# This is a STANDALONE project, independent of DOONY. It lives in a subdir only
# for convenience; to split it into its own repo, copy the Cellar/ directory out
# and `git init` there — nothing here references anything outside Cellar/.
name: Cellar
options:
  bundleIdPrefix: com.doony
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"   # bump before every upload — App Store Connect rejects a reused build number
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "24Q366W5BQ"            # your Apple Team ID (same as DOONY)
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_BITCODE: NO

targets:
  Cellar:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Cellar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.cellar
        # Hand-maintained entitlements/Info.plist, referenced not generated —
        # see the DOONY project.yml notes for why the `entitlements:`/`info:`
        # keys are avoided.
        CODE_SIGN_ENTITLEMENTS: Cellar/Cellar.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Cellar/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only. Must live at target level (see DOONY notes on err 90474).
        TARGETED_DEVICE_FAMILY: "1"

  CellarTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: CellarTests
    dependencies:
      - target: Cellar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.cellar.tests
        GENERATE_INFOPLIST_FILE: YES
